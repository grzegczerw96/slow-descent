<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slow Descent · szkoła freedivingu, Gdynia</title>
<meta name="description" content="Kursy freedivingu w Gdyni dla początkujących i wyjazdy na głęboką wodę. Terminy, ceny, zapisy.">
<link rel="icon" href="data:,">
<link rel="preload" href="media/f2-poster.jpg" as="image">
<link rel="stylesheet" href="../lib/film-page-2.css">
<style>
/* V. Sceny. The film, then one question per frame: text on navy at the left, a living picture at the right.
   The fin closes the picture once, in the middle of the film, and the next shot begins behind it. */

</style>
<script src="../lib/gsap-3.12.5.min.js" defer></script>
<script src="../lib/ScrollTrigger-3.12.5.min.js" defer></script>
<script src="../lib/lenis-1.1.13.min.js" defer></script>
<script src="../lib/home-core-2.js" defer></script>
<script src="../lib/info-2.js" defer></script>
<script src="../lib/film-2.js" defer></script>
<script src="../lib/film-tracks-1.js" defer></script>
<script src="../lib/film-run-2.js" defer></script>
</head>
<body data-base="media/">
<!-- src: 'f2-woman-0.mp4' src: 'f2-woman-1.mp4' src: 'f2-woman-2.mp4' src: 'f2-woman-3.mp4' src: 'f2-head.mp4' src: 'f2-fins.mp4' src: 'f2-pass.mp4' src: 'f2-flip.mp4' src: 'f2-glide.mp4' src: 'f2-up.mp4' src: 'col-entry.mp4' src: 'col-surface.mp4' src: 'col-reef.mp4' -->
<div class="stage">
  <canvas class="gl"></canvas>
  <div class="shade"></div>
  <div class="over">
    <div class="hero"><h1>Slow Descent</h1><p>Uczymy oddychać, zanim nauczymy nurkować.</p></div>
    <p class="line" id="l1">Od teraz jesteś tylko ty i&nbsp;twoje emocje.</p><p class="line" id="l2">Oddech się reguluje, myśli się porządkują.</p><p class="line" id="l3">Z&nbsp;każdym metrem masz w&nbsp;sobie więcej siły.</p><p class="line" id="l4">Teraz już wiesz: twoje emocje to nie ty.</p><p class="line" id="l5">Tego można się nauczyć.</p>
    <div id="scenes"></div>
  </div>
</div>
<div id="navmount"></div>
<main><div class="spacer" aria-hidden="true"></div></main>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const base = document.body.dataset.base, { ss, c01, lerp, beat, reduce } = Home, { span, WOMAN, CLIP, track } = FilmPage, $ = s => document.querySelector(s);
  const cut = .012;
  // She is only ever seen whole and small in the frame, or as head and shoulders, or as fins: no close frames of the body.
  const Shots = {
    wide: (on, t, g, cam) => ({ name: 'kobieta', parts: WOMAN(), asp: 16 / 9, depth: true, poster: base + 'f2-poster.jpg', track: track('film'), on, t, g, cam }),
    head: (on, t, g, cam) => ({ parts: CLIP('f2-head.mp4', 5), asp: 16 / 9, float: .8, on, t, g, cam }),
    fins: (on, t, g, cam) => ({ parts: CLIP('f2-fins.mp4', 3.5), asp: 16 / 9, float: .8, on, t, g, cam }),
    pass: (on, t, keep, cam) => ({ name: 'nurek', parts: CLIP('f2-pass.mp4', 9.1), asp: 9 / 16, keep: () => keep, g: () => .6, on, t, cam }),
    flip: (on, t, keep, cam) => ({ name: 'przewrót', parts: CLIP('f2-flip.mp4', 8.8), asp: 9 / 16, keep: () => keep, g: () => .8, track: track('flip'), on, t, cam }),
    glide: (on, t, keep, cam) => ({ name: 'nurek', parts: CLIP('f2-glide.mp4', 3.6), asp: 9 / 16, keep: () => keep, g: () => 1, track: track('glide'), on, t, cam }),
    up: (on, t, keep, cam) => ({ name: 'w górę', parts: CLIP('f2-up.mp4', 2.8), asp: 9 / 16, keep: () => keep, g: () => 1, track: track('up'), on, t, cam }),
    entry: (on, t, keep, cam) => ({ parts: CLIP('col-entry.mp4', 7), asp: 9 / 16, keep: () => keep, g: () => .4, on, t, cam }),
    reef: (on, t, keep, cam) => ({ parts: CLIP('col-reef.mp4', 7), asp: 9 / 16, keep: () => keep, g: () => 1, on, t, cam }),
    surface: (on, t, keep, cam) => ({ parts: CLIP('col-surface.mp4', 17.4), asp: 16 / 9, keep: () => keep, g: () => 1, on, t, cam }),
  };

  const S0 = 13.1, STEP = 1.55, H0 = i => S0 + i * STEP, HOLD = i => H0(i) + .75, END = H0(6);
  const toScene = i => HOLD(i).toFixed(2);
  $('#navmount').outerHTML = '<header class="nav">\n  <p class="brand"><a href="#" data-go="0">Slow Descent</a><span class="sub">Szkoła freedivingu, Gdynia</span></p>\n  <div class="links"><a class="skip" href="#start" data-go="@0">Kursy i terminy</a><a class="more" href="#kursy" data-go="@1">Kursy</a><a class="more" href="#terminy" data-go="@2">Terminy</a><a class="more" href="#pytania" data-go="@3">Pytania</a><a class="more" href="#zasady" data-go="@4">Bezpieczeństwo</a><a class="cta" href="#zapis" data-go="@5">Zapisz się</a></div>\n</header>\n'.replace(/@(\d)/g, (m, n) => toScene(+n));
  const sceneEls = Info2.scenes($('#scenes'), toScene);
  // the picture beside each answer; each scene's frame is as wide as its words allow
  const WIN = [.60, .66, .62, .70, .62, .60];
  const win = i => [WIN[i], 0, 1, 1];
  const shots = [
    Shots.wide([-2, -1, 2.0, 2.35], h => Math.min(8, 1.5 + c01(h / 2.35) * 6 + (intro.t - 3) * .5), () => 0, [[0, .5, .42, 1.04, -.004], [2.35, .46, .46, 1.07, .004]]),
    Shots.head([2.0, 2.35, 3.6, 3.95], span(2, 3.95, .1, 4.8), () => .1, [[2, .5, .5, 1.04, .004], [3.95, .46, .52, 1.14, -.004]]),
    Shots.fins([3.6, 3.95, 5.1, 5.45], span(3.6, 5.45, .1, 3.4), () => .34, [[3.6, .5, .5, 1.03, .004], [5.45, .52, .46, 1.12, -.004]]),
    Shots.pass([5.1, 5.45, 6.75, 6.75 + cut], span(5.1, 6.75, 2.3, 5.22), .6, [[5.1, .5, .34, 1.02], [6.1, .5, .42, 1.03], [6.75, .42, .62, 1.32]]),
    Shots.flip([6.75, 6.75 + cut, 8.75, 8.75 + cut], span(6.75, 8.75, 2.4, 8.6), .8, [[6.75, .5, .44, 1.02], [7.9, .5, .3, 1.02], [8.75, .5, .34, 1.04]]),
    Shots.glide([8.75, 8.75 + cut, 10.3, 10.65], span(8.75, 10.65, .8, 3.0), .92, [[8.75, .5, .46, 1.02], [10.65, .5, .47, 1.04]]),
    Shots.up([10.3, 10.65, 11.5, 11.95], span(10.3, 11.95, .1, 2.7), .95, [[10.3, .5, .55, 1.02], [11.95, .5, .42, 1.05]]),
    // the pictures beside the answers
    Shots.head([H0(0) - .25, H0(0), H0(1) - .1, H0(1) + .1], span(H0(0), H0(1) + .1, .4, 4.6), () => .55, [[H0(0), .78, .52, 1.12, 0], [H0(1), .66, .54, 1.12, 0]]),
    Shots.flip([H0(1) - .1, H0(1) + .1, H0(2) - .1, H0(2) + .1], span(H0(1), H0(2) + .1, 2.6, 8.4), .9, [[H0(1), .5, .45, 1, 0], [H0(2), .5, .4, 1, 0]]),
    Shots.reef([H0(2) - .1, H0(2) + .1, H0(3) - .1, H0(3) + .1], span(H0(2), H0(3) + .1, .2, 6.6), .85, [[H0(2), .5, .5, 1, 0], [H0(3), .5, .5, 1, 0]]),
    Shots.entry([H0(3) - .1, H0(3) + .1, H0(4) - .1, H0(4) + .1], span(H0(3), H0(4) + .1, .2, 6.6), .85, [[H0(3), .5, .46, 1, 0], [H0(4), .5, .48, 1, 0]]),
    Shots.glide([H0(4) - .1, H0(4) + .1, H0(5) - .1, H0(5) + .1], span(H0(4), H0(5) + .1, .2, 3.4), .95, [[H0(4), .5, .36, 1, 0], [H0(5), .5, .36, 1, 0]]),
    Shots.surface([H0(5) - .1, H0(5) + .1, H0(6) + 2, H0(6) + 3], span(H0(5), H0(6), 3, 9), .75, [[H0(5), .5, .4, 1.1, 0], [H0(6), .5, .36, 1.14, 0]]),
  ];
  const intro = { t: .3, ui: reduce ? 1 : 0 };
  beat($('.hero'), [-2, -1, .1, .4], { name: 'tytuł', y: 12, settle: false });
  beat($('#l1'), [.7, .95, 1.7, 1.95], { name: 'l1', y: 8 });
  beat($('#l2'), [2.5, 2.75, 3.4, 3.65], { name: 'l2', y: 8 });
  beat($('#l3'), [4.1, 4.35, 4.95, 5.2], { name: 'l3', y: 8 });
  beat($('#l4'), [8.95, 9.2, 9.55, 9.75], { name: 'l4', y: 8 });
  beat($('#l5'), [12.0, 12.25, 12.7, 12.95], { name: 'l5', y: 8 });
  sceneEls.forEach((el, i) => { beat(el, [H0(i) + .1, H0(i) + .35, H0(i) + 1.2, H0(i) + 1.45], { name: 'scena' + i, y: 10, blur: 6 }); el.style.setProperty('--tw', `calc(${WIN[i] * 100}vw - var(--g)*2)`); });
  const shade = $('.shade'), lines = ['#l1', '#l2', '#l3', '#l4'].map($);
  FilmPage.start({ shots, total: END, base, readingFrom: S0 - .1, onFrame(h, y, now, film) {
    // the frame: the whole screen in the film, then at each scene as wide as its words leave free
    let x0 = 0;
    if (h > 12.6) {
      const f = c01((h - S0) / STEP), i = Math.min(5, Math.max(0, Math.floor((h - S0) / STEP))), j = Math.min(5, i + 1);
      const k = ss((h - H0(i) - 1.3) / .42);
      x0 = lerp(WIN[i], WIN[j], k);
      if (h < S0 + .05) x0 = lerp(1, WIN[0], ss((h - 12.95) / .15));
    } else if (h > 11.95) x0 = 1;
    film.state.win = [x0, x0 > 0 ? 0 : 0, 1, 1];
    shade.style.opacity = Math.max(...lines.map(l => +l.style.opacity || 0));
  } }).then(() => {
    if (reduce) return;
    gsap.from($('.gl'), { opacity: 0, duration: 2.4, ease: 'sine.inOut', delay: .1 });
    gsap.from($('.hero h1'), { opacity: 0, y: 18, filter: 'blur(10px)', duration: 2.2, ease: 'power2.out', delay: .7, clearProps: 'all' });
    gsap.from($('.hero p'), { opacity: 0, duration: 1.4, ease: 'power2.out', delay: 2, clearProps: 'all' });
    gsap.to(intro, { t: 3, duration: 5, ease: 'sine.out' });
  });
});
</script>
</body>
</html>
